# bench.yaml with enforce_command_limits: true, for H12 only; the self-test fails if the two files
# differ in any other line. See docs/bench-check.md, "Command limits (H12)".
controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm:
      type: joint_trajectory_controller/JointTrajectoryController
    wheels:
      type: velocity_controllers/JointGroupVelocityController

arm:
  ros__parameters:
    joints: [joint1, joint2]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    interpolate_from_desired_state: false

wheels:
  ros__parameters:
    joints: @WHEELS@
