controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

joint_trajectory_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2

    command_interfaces:
      - position
      - velocity
    
    state_interfaces:
      - position
      - velocity
    
    state_publish_rate: 200.0
    action_monitor_rate: 100.0

    allow_partial_joints_goal: true
    interpolate_from_desired_state: false
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01 # Defaults to 0.01
      goal_time: 0.0 # Defaults to 0.0 (start immediately)

# A plain passthrough of the commanded velocity, held until the next command. Not a
# JointTrajectoryController: in 4.40 (jazzy) it segfaults the whole ros2_control_node on
# velocity-only trajectories -- on a continuous joint, or whenever the first point is already
# due (time_from_start 0) -- and its only job here was this same passthrough.
joint_velocity_controller:
  ros__parameters:
    joints:
      - joint3
