controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_trajectory_velocity_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2

    command_interfaces:
      - position
      - velocity
    
    state_interfaces:
      - position
      - velocity
    
    state_publish_rate: 200.0
    action_monitor_rate: 100.0

    allow_partial_joints_goal: true
    interpolate_from_desired_state: false
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01 # Defaults to 0.01
      goal_time: 0.0 # Defaults to 0.0 (start immediately)

joint_trajectory_velocity_controller:
  ros__parameters:
    joints:
      - joint3
    
    command_interfaces:
      - velocity
    
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 200.0 # Defaults to 50
    action_monitor_rate: 20.0 # Defaults to 20

    allow_partial_joints_goal: false # Defaults to false
    interpolate_from_desired_state: true
    gains: # zero feedback + unity feedforward == the old open-loop passthrough
      joint3:
        p: 0.0
        i: 0.0
        d: 0.0
        ff_velocity_scale: 1.0 # Defaults to 0.0, which would command zero velocity
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01 # Defaults to 0.01
      goal_time: 0.0 # Defaults to 0.0 (start immediately)
